<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW</title>
<style>
div {
margin-left: 100px;
margin-top: 200px;
height: 100px;
width: 200px;
border: 2px solid red;
/* offset box-shadow: x-offset y- and color x means hor and y means verticaL -for blur =#5e5e5e
format =x-off the y-off then blur and spread
*/
box-shadow: -20px 20px 10px 10px rebeccapurple

}

h1{

font-size: 50px;
margin-left: 100px;
margin-top: 100px;
color: brown;
/* text-shadow: x-offset y-offset blur radius and color */
text-shadow: -10px -10px 5px gray;

}


</style>

</head>
<body>
    box shadow and text shadow
    <div>BOX AND SHADOW DEMO</div>

    <h1>HEADER</h1>
</body>
</html>
