<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>
        body{
            margin:0;
            padding:0;
            background-color:white;
        }

        .box{
            width:320px;
            background:#F1E7BA;
            padding:30px;
            margin:auto;
            margin-top:200px;
        }

        label{
            color:white;
            font-size:14px;
        }

        input{
            width:270px;
            padding:10px;
            margin-top:8px;
            margin-bottom:20px;
            border:none;
            border-radius:3px;
        }

        button{
            width:290px;
            padding:12px;
            background:#E84420;
            color:white;
            border:none;
            border-radius:15px;
            font-size:16px;
        }
    </style>
</head>

<body>

    <div class="box">

        <label>Enter Username:</label><br>
        <input type="text" placeholder="Enter email ID">

        <br>

        <label>Enter Password:</label><br>
        <input type="password" placeholder="Password here">

        <br>

        <button>Login</button>

    </div>

</body>
</html>
